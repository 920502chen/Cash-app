        INFOPLIST_KEY_CFBundleDisplayName: 智慧記帳
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: 4
        SWIFT_VERSION: "5.0"
