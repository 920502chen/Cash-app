name: MrSmartLedger
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  MrSmartLedger:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mrsmartledger.personal
